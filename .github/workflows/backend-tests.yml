name: Backend Tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  # ========== PYTHON BACKEND TESTS ==========
  test-python:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          pip install -r backend/python-service/requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run Tests with Coverage
        run: |
          cd backend/python-service
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          files: ./backend/python-service/coverage.xml
          flags: python-backend
          name: python-coverage

  # ========== NODE BACKEND TESTS ==========
  test-node:
    name: Node Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['16.x', '18.x', '20.x']
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'backend/node-service/package-lock.json'
      
      - name: Install Dependencies
        run: cd backend/node-service && npm ci
      
      - name: Run Tests with Coverage
        run: cd backend/node-service && npm run test:cov --if-present
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          files: ./backend/node-service/coverage/coverage-final.json
          flags: node-backend
          name: node-coverage

  # ========== INTEGRATION TESTS ==========
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-python, test-node]
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Python Dependencies
        run: pip install -r backend/python-service/requirements.txt
      
      - name: Install Node Dependencies
        run: cd backend/node-service && npm ci
      
      - name: Run Integration Tests
        run: |
          cd backend
          npm run test:integration --if-present || echo "No integration tests defined"

  # ========== SECURITY CHECK ==========
  security-check:
    name: Security Vulnerabilities Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Check Python Dependencies
        run: |
          pip install safety
          safety check --json backend/python-service/requirements.txt || true

  # ========== SUMMARY ==========
  backend-tests-summary:
    name: Backend Tests Summary
    needs: [test-python, test-node, integration-tests, security-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All Tests Passed
        if: ${{ needs.test-python.result == 'success' && needs.test-node.result == 'success' }}
        run: echo "✅ All backend tests passed!"
      
      - name: Some Tests Failed
        if: ${{ failure() }}
        run: |
          echo "❌ Some tests failed"
          exit 1