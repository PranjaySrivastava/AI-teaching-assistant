name: PR Checks - Linting & Format

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  # ========== CODE QUALITY & TYPE CHECK ==========
  lint-and-typecheck:
    name: Lint & Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: ESLint Check (Frontend & Node Backend)
        run: npm run lint

      - name: Prettier Format Check
        run: npm run format:check

      - name: TypeScript Type Check (Frontend)
        run: npm run type-check

  # ========== PYTHON BACKEND LINTING ==========
  lint-python:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Linters
        run: |
          pip install flake8 black isort
          pip install -r backend/python-service/requirements.txt

      - name: Flake8 Check
        run: flake8 backend/python-service --max-line-length=100 --extend-ignore=E203,W503

      - name: Black Format Check
        run: black --check backend/python-service

      - name: isort Import Check
        run: isort --check-only backend/python-service

  # ========== SUMMARY ==========
  pr-checks-summary:
    name: PR Checks Summary
    needs: [lint-and-typecheck, lint-python]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.lint-python.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "✅ All PR checks passed successfully!"