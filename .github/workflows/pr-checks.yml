name: PR Checks - Linting & Format

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'backend/python-service/**'
              - '.github/workflows/pr-checks.yml'
            node:
              - 'frontend/**'
              - 'backend/node-service/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/pr-checks.yml'

  # ========== CODE QUALITY & TYPE CHECK ==========
  lint-and-typecheck:
    name: Lint & Type Checking
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Prettier Format Check (All Files)
        run: npm run format:check

      - name: ESLint Check (Frontend & Node Backend)
        if: needs.detect-changes.outputs.node == 'true'
        run: npm run lint

      - name: TypeScript Type Check (Frontend)
        if: needs.detect-changes.outputs.node == 'true'
        run: npm run type-check

  # ========== PYTHON BACKEND LINTING ==========
  lint-python:
    name: Python Linting
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip Check
        if: needs.detect-changes.outputs.python != 'true'
        run: echo "⏩ No Python changes detected. Skipping Python linting."

      - name: Setup Python
        if: needs.detect-changes.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Linters
        if: needs.detect-changes.outputs.python == 'true'
        run: |
          pip install flake8 black isort
          pip install -r backend/python-service/requirements.txt

      - name: Flake8 Check
        if: needs.detect-changes.outputs.python == 'true'
        run: flake8 backend/python-service --max-line-length=100 --extend-ignore=E203,W503

      - name: Black Format Check
        if: needs.detect-changes.outputs.python == 'true'
        run: black --check backend/python-service

      - name: isort Import Check
        if: needs.detect-changes.outputs.python == 'true'
        run: isort --check-only backend/python-service

  # ========== SUMMARY ==========
  pr-checks-summary:
    name: PR Checks Summary
    needs: [lint-and-typecheck, lint-python]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.lint-python.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "✅ All PR checks passed successfully!"