name: Frontend Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  # ========== FRONTEND UNIT TESTS ==========
  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install Dependencies
        run: cd frontend && npm ci
      
      - name: Run Tests with Coverage
        run: cd frontend && npm run test:cov --if-present
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  # ========== BUILD CHECK ==========
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install Dependencies
        run: cd frontend && npm ci
      
      - name: Build Project
        run: cd frontend && npm run build
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        continue-on-error: true
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 1

  # ========== LIGHTHOUSE PERFORMANCE ==========
  lighthouse:
    name: Lighthouse Performance Check
    runs-on: ubuntu-latest
    needs: build-check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install Dependencies
        run: cd frontend && npm ci
      
      - name: Build Project
        run: cd frontend && npm run build
      
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        continue-on-error: true
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './frontend/lighthouserc.json'

  # ========== ACCESSIBILITY CHECK ==========
  a11y-check:
    name: Accessibility Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install Dependencies
        run: cd frontend && npm ci
      
      - name: Run A11y Tests
        run: cd frontend && npm run test:a11y --if-present || echo "No a11y tests configured"

  # ========== SUMMARY ==========
  frontend-tests-summary:
    name: Frontend Tests Summary
    needs: [test-frontend, build-check, lighthouse, a11y-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "✅ Frontend tests, build, and lighthouse checks complete!"
          if [ "${{ needs.test-frontend.result }}" != "success" ] || [ "${{ needs.build-check.result }}" != "success" ]; then
            exit 1
          fi